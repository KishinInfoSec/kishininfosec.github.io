<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">~/</span>kishininfosec</a>
    <nav>
      <a href="{{ '/' | relative_url }}#templates">templates</a>
      <a href="{{ site.github }}">github</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer class="site-footer">
    MIT licensed · <a href="{{ site.github }}/blob/main/LICENSE">LICENSE</a> · templates contain no credentials; bring your own.
  </footer>
  <script src="{{ '/assets/copy.js' | relative_url }}" defer></script>
</body>
</html>
